name: Huddle Local AI Browser Check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/local-ai-browser-check.yml']
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: python -m pip install selenium==4.38.0
      - name: Check on-device AI model start in real Chrome
        shell: bash
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time
          base='https://huddle-web-production-76f3.up.railway.app/'
          o=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1120,900']:
              o.add_argument(arg)
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          browser=webdriver.Chrome(options=o)
          browser.set_page_load_timeout(45)
          try:
              browser.get(base)
              time.sleep(7)
              browser.execute_script("document.querySelector('#authScreen').classList.add('hidden'); document.querySelector('#appScreen').classList.remove('hidden'); state.aiOpen=true; document.querySelector('#aiView').classList.remove('hidden'); aiStatus();")
              btn=browser.find_element(By.ID,'aiLocalStart')
              print('LOCAL_AI_BUTTON_VISIBLE='+str(btn.is_displayed()),flush=True)
              btn.click()
              time.sleep(5)
              result=browser.execute_script("return {active:state.localAI.active,loading:state.localAI.loading,ready:state.localAI.ready,progress:state.localAI.progress,error:state.localAI.error};")
              print('LOCAL_AI_INITIAL='+str(result),flush=True)
              for i in range(16):
                  if result.get('ready') or result.get('error'):break
                  time.sleep(10)
                  result=browser.execute_script("return {loading:state.localAI.loading,ready:state.localAI.ready,progress:state.localAI.progress,error:state.localAI.error,debug:state.localAI.debug};")
                  if i%3==0:print('LOCAL_AI_PROGRESS='+str(result),flush=True)
              print('LOCAL_AI_FINAL='+str(result),flush=True)
              logs=browser.get_log('browser')
              for item in logs:
                  msg=item.get('message','').lower()
                  if 'content security policy' in msg or 'violates the following' in msg:
                      print('LOCAL_AI_CSP_WARNING='+msg[:280].replace('\\n',' '),flush=True)
              assert not result.get('error'), 'The worker failed to load model'
              if not result.get('ready'):print('LOCAL_AI_MODEL_STILL_LOADING=True',flush=True)
              else:
                  print('LOCAL_AI_MODEL_LOADED=True',flush=True)
                  browser.execute_script("""window._huddleProbeAnswer=null;
                      state.localAI.job={
                          id:'real-generation-check',
                          resolve:(txt)=>{window._huddleProbeAnswer=txt;},
                          reject:(err)=>{window._huddleProbeAnswer='ERROR: '+err.message;}
                      };
                      state.localAI.worker.postMessage({
                          type:'ask',id:'real-generation-check',
                          messages:[{role:'user',content:'Give one short sentence explaining what gravity is.'}],
                          max_new_tokens:24
                      });""")
                  for _ in range(18):
                      time.sleep(5)
                      reply=browser.execute_script('return window._huddleProbeAnswer;')
                      if reply is not None:break
                  print('LOCAL_AI_GENERATED_RESPONSE_PRESENT='+str(bool(reply and len(reply)>8 and not reply.startswith('ERROR:'))),flush=True)
                  print('LOCAL_AI_GENERATED_RESPONSE_LENGTH='+str(len(reply or '')),flush=True)
                  assert reply and len(reply)>8 and not reply.startswith('ERROR:'), 'Local AI did not generate a usable response'
          finally:
              browser.quit()
          PY
