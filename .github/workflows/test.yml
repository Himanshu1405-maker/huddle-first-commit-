name: Huddle Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/web/app.js
      - run: node --check app/web/chat-enhancements.js
      - run: node tests/chat_enhancements.cjs
      - run: node tests/frontend_smoke.cjs
      - run: node tests/auth_bloom.cjs
      - run: node tests/auth_luxe.cjs
      - run: node --check app/web/auth-luxe.js
      - run: node tests/frontend_otp_ai.cjs
      - run: node tests/google_mobile_ux.cjs
      - run: node tests/google_sdk_upgrade.cjs
      - run: node tests/google_direct_login.cjs
      - run: node tests/ai_ux.cjs
      - run: node --check app/web/puter-ai.js
      - run: node tests/puter_ai.cjs
      - run: node tests/local_ai.cjs
      - run: node tests/chat_layout.cjs
      - run: node --check app/web/chat-themes.js
      - run: node tests/chat_themes.cjs
      - run: node tests/header_reactions.cjs
      - run: node --check app/web/voice-media-player.js
      - run: node tests/voice_media_polish.cjs
      - run: node tests/quick_reactions.cjs
      - run: node --check app/web/responsive-composer.js
      - run: node tests/responsive_composer.cjs
      - run: node --check app/web/message-interactions.js
