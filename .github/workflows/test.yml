name: Huddle Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/web/app.js
      - run: node tests/frontend_smoke.cjs
      - run: node tests/frontend_otp_ai.cjs
      - run: node tests/google_mobile_ux.cjs
      - run: node tests/google_sdk_upgrade.cjs
      - run: node tests/google_direct_login.cjs
      - run: node tests/ai_ux.cjs
