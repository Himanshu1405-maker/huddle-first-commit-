name: Google Origin Live Check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/google-origin-live-check.yml'
jobs:
  verify-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install selenium==4.38.0
      - name: Check Google authorization after client settings saved
        shell: bash
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import time
          base='https://huddle-web-production-76f3.up.railway.app/'
          opts=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1120,850']:
              opts.add_argument(arg)
          browser=webdriver.Chrome(options=opts)
          try:
              browser.get(base)
              frame=WebDriverWait(browser,25).until(
                  lambda driver: driver.find_element(By.CSS_SELECTOR,'#googleSignInButton iframe'))
              print('HUDDLE_GOOGLE_IFRAME=loaded',flush=True)
              browser.switch_to.frame(frame)
              button=WebDriverWait(browser,15).until(
                  EC.element_to_be_clickable((By.CSS_SELECTOR,'div[role="button"]')))
              button.click()
              browser.switch_to.default_content()
              time.sleep(5)
              handles=browser.window_handles
              print('GOOGLE_POPUP_OPEN='+str(len(handles)>1),flush=True)
              if len(handles)>1:
                  browser.switch_to.window(handles[-1])
                  WebDriverWait(browser,20).until(lambda d: 'accounts.google.com' in d.current_url or 'google.com' in d.current_url)
                  time.sleep(4)
                  body=browser.find_element(By.TAG_NAME,'body').text.lower()
                  url=browser.current_url.lower()
                  mismatch='origin_mismatch' in body or 'origin_mismatch' in url
                  print('GOOGLE_ORIGIN_MISMATCH='+str(mismatch),flush=True)
                  print('GOOGLE_ACCOUNT_CHOOSER='+str('choose an account' in body or 'sign in with google' in body or 'use another account' in body),flush=True)
                  print('GOOGLE_PAGE_ACCESS_BLOCKED='+str('access blocked' in body),flush=True)
                  print('GOOGLE_PAGE_DOMAIN_GOOGLE='+str('google.com' in url),flush=True)
              else:
                  print('GOOGLE_POPUP_UNAVAILABLE_IN_HEADLESS=True',flush=True)
          except Exception as e:
              print('BROWSER_CHECK_EXCEPTION='+type(e).__name__,flush=True)
              raise
          finally: browser.quit()
          PY
