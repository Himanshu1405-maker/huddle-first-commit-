  workflow_dispatch:
jobs:
  real-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt selenium==4.38.0 requests
      - name: Verify frontend JavaScript parses
        run: |
          node --check app/web/app.js
          node --check app/web/auth-luxe.js
          node --check app/web/chat-themes.js
          node --check app/web/message-interactions.js
          node --check app/web/moments.js
          node --check app/web/voice-media-player.js
          node --check app/web/responsive-composer.js
          node --check app/web/image-lightbox.js
          node --check app/web/view-once.js
      - name: Check new sign-in and registration design at desktop and mobile widths
        run: PYTHONPATH=. python tests/browser_auth.py
      - name: Check responsive themes and account-scoped chat wallpaper persistence
        run: PYTHONPATH=. python tests/browser_themes.py
      - name: Check contact headers and inline reaction badges on mobile
        run: PYTHONPATH=. python tests/browser_header_reactions.py
      - name: Check desktop and mobile message actions
        run: PYTHONPATH=. python tests/browser_message_actions.py
      - name: Verify compact images, voice controls and reaction layout on mobile
        run: PYTHONPATH=. python tests/browser_voice_media_polish.py
      - name: Check entire Chats home page scrolling and filter navigation
        run: PYTHONPATH=. python tests/browser_full_home_scroll.py
      - name: Check Back to Chats and whole-sidebar scrolling at desktop and mobile widths
        run: PYTHONPATH=. python tests/browser_sidebar_navigation.py
      - name: Check semantic vector chat previews and smooth inbox rendering in Chrome
        run: PYTHONPATH=. python tests/browser_chat_previews.py
      - name: Check refreshed photo, video and document preview across desktop and Android
        run: PYTHONPATH=. python tests/browser_media_studio.py
      - name: Check View Once media preview, consumption and mobile scrolling
        run: PYTHONPATH=. python tests/browser_view_once.py
      - name: Check private inline AI in mobile chats and opt-in message context
        run: PYTHONPATH=. python tests/browser_chat_ai.py
      - name: Check responsive multiline composer and modern voice notes in Chrome
        run: PYTHONPATH=. python tests/browser_responsive_composer.py
      - name: Check audio durations, waveform progress, image viewer and instant composer wrap
        run: PYTHONPATH=. python tests/browser_audio_gallery_composer.py
      - name: Verify real Chromium two-account multimedia behavior against isolated SQLite
        run: PYTHONPATH=. python tests/browser_media.py
