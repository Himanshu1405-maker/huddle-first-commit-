name: Huddle Two-Account Media Browser QA
on:
  push:
    paths:
      - app/main.py
      - app/extensions.py
      - app/web/app.js
      - app/web/chat-enhancements.js
      - app/web/chat-enhancements.css
      - app/web/index.html
      - app/web/auth-bloom.css
      - app/web/auth-luxe.css
      - app/web/auth-luxe.js
      - tests/browser_auth.py
      - tests/browser_themes.py
      - app/web/chat-themes.css
      - app/web/message-interactions.js
      - app/web/message-interactions.css
      - app/message_context.py
      - tests/browser_message_actions.py
      - tests/test_message_context.py
      - app/web/chat-themes.js
      - app/web/chat-doodle.svg
      - tests/browser_media.py
      - tests/test_media_ranges.py
      - .github/workflows/media-browser-qa.yml
  pull_request:
    paths:
      - app/main.py
      - app/extensions.py
      - app/web/app.js
      - app/web/chat-enhancements.js
      - app/web/chat-enhancements.css
      - app/web/index.html
      - app/web/auth-bloom.css
      - app/web/auth-luxe.css
      - app/web/auth-luxe.js
      - tests/browser_auth.py
      - tests/browser_themes.py
      - app/web/chat-themes.css
      - app/web/message-interactions.js
      - app/web/message-interactions.css
      - app/message_context.py
      - tests/browser_message_actions.py
      - tests/test_message_context.py
      - app/web/chat-themes.js
      - app/web/chat-doodle.svg
      - tests/browser_media.py
      - tests/test_media_ranges.py
      - .github/workflows/media-browser-qa.yml
  workflow_dispatch:
jobs:
  real-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt selenium==4.38.0 requests
      - name: Verify frontend JavaScript parses
        run: |
          node --check app/web/app.js
          node --check app/web/auth-luxe.js
          node --check app/web/chat-themes.js
          node --check app/web/message-interactions.js
      - name: Check new sign-in and registration design at desktop and mobile widths
        run: PYTHONPATH=. python tests/browser_auth.py
      - name: Check responsive themes and account-scoped chat wallpaper persistence
        run: PYTHONPATH=. python tests/browser_themes.py
      - name: Check desktop and mobile message actions
        run: PYTHONPATH=. python tests/browser_message_actions.py
      - name: Verify real Chromium two-account multimedia behavior against isolated SQLite
        run: PYTHONPATH=. python tests/browser_media.py
